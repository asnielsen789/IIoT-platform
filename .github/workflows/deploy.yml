name: Deploy

# Continuous deployment of the Function's code to staging (#5).
#
# Every change to main that alters the deployed Function is built, tested, packaged and
# deployed to the staging Function App; the run then refreshes the app's Key Vault references
# and checks that the function is listed. Each deployment is recorded on the repository's
# Environments page under `staging`, with the commit it deployed, so what runs in staging can
# always be traced to a commit and to the test run that passed it.
#
# Trust model:
#
# - Identity. A user-assigned managed identity that exists for this workflow alone
#   (infra/modules/github-deployment.bicep). It is not the identity the app runs as, and it
#   holds one role, Website Contributor, on the Function App and nowhere else.
# - No stored secret. The deploy job asks GitHub for a short-lived OIDC token, and azure/login
#   exchanges it with Microsoft Entra ID for an access token for that identity. Entra ID accepts
#   only a token GitHub issued for the subject the identity's federated credential names: this
#   repository, by its immutable owner and repository IDs, in the GitHub environment `staging`.
#   There is no client secret or certificate to store, leak or rotate. The client, tenant and
#   subscription IDs are identifiers, not credentials; they are variables of the `staging`
#   environment rather than part of this file.
# - The subject binds to the environment, not to a branch. The environment's deployment branch
#   policy, which allows only main, is what keeps any other branch from obtaining a token that
#   matches. It is part of the security boundary; infra/README.md shows how to set it up.
# - Only the deploy job can request a token. The build job, which runs the repository's code and
#   tests, can read the repository and nothing else.
#
# Infrastructure is deliberately not deployed here. The Bicep templates create role
# assignments, so deploying them takes the right to assign roles on the subscription, close to
# Owner, and an identity holding it would be the most powerful credential in the project.
# Infrastructure stays a manual step (infra/README.md, "Deploy"). What-if on pull requests is
# deferred for the same reason: it would need a second identity with rights across the
# subscription, usable from pull requests (ADR-002, update of 2026-10-19).

on:
  push:
    branches: [main]
    # Only changes that alter the deployed package or how it is built. Tests, tools and
    # documentation do not reach the package, so changing them redeploys nothing. A
    # Directory.Build.targets, Directory.Packages.props or NuGet.config added at the root would
    # change the build and belongs in this list.
    paths:
      - "src/**"
      # Embedded into IIoT.Core.dll: src/IIoT.Core/IIoT.Core.csproj links it in from docs/.
      - "docs/schemas/telemetry-v1.schema.json"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Solution.targets"
      - "IIoT.slnx"
      - ".github/workflows/deploy.yml"
  # Redeploys main on demand, for example after the infrastructure has been recreated. Started
  # from any other branch, it builds and tests but does not deploy.
  workflow_dispatch:

# Least privilege: the default for every job is to read the repository. The deploy job widens
# this for itself only.
permissions:
  contents: read

# One deployment to staging at a time, and a deployment that has started always finishes:
# cancelling it between the package upload and the Key Vault check would leave staging in a
# state no run has verified. A run that arrives while another is in progress waits; of several
# waiting runs GitHub keeps only the newest, which deploys the latest main.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions are pinned to full commit SHAs rather than mutable tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK global.json pins, as in ci.yml: the package is built with the SDK that CI
          # verified.
          global-json-file: global.json

      - name: Show .NET SDK
        run: |
          dotnet --version
          dotnet --list-sdks

      # Solution-level restore, as in ci.yml. Directory.Solution.targets makes it run the
      # Functions post-restore hook, which generates the extensions project the package needs.
      - name: Restore
        run: dotnet restore IIoT.slnx

      - name: Build
        run: dotnet build IIoT.slnx --no-restore --configuration Release

      # The commit is tested in the run that packages it, so no package is made from assemblies
      # that did not pass. CI tested the pull request's merge commit; this tests what main holds.
      - name: Test
        run: dotnet test IIoT.slnx --no-build --configuration Release

      # --no-build: the package holds the very assemblies the Test step ran against, plus what
      # Azure.Functions.Sdk adds for the host: host.json, worker.config.json, extensions.json and
      # the Event Hubs extension under .azurefunctions/. Compared with Core Tools, which deployed
      # staging before this workflow: its publish runs `dotnet build --output bin/publish
      # --configuration release`, which yields the same files plus IIoT.Core.deps.json, a file
      # the host does not read. Its packaging command, `func pack`, runs `dotnet publish` and
      # yields exactly these files.
      - name: Package
        run: |
          dotnet publish src/IIoT.Functions/IIoT.Functions.csproj \
            --no-build \
            --configuration Release \
            --output "$RUNNER_TEMP/functionapp"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: functionapp-${{ github.sha }}
          path: ${{ runner.temp }}/functionapp
          # .azurefunctions/ is a hidden folder, and upload-artifact leaves hidden files out
          # unless told otherwise. Without it the host cannot load the trigger's extension.
          # Microsoft's .NET workflow template for Azure Functions sets this for that reason.
          include-hidden-files: true
          if-no-files-found: error
          # A re-run of this job replaces the package it built before, from the same commit,
          # instead of failing on the name.
          overwrite: true
          # Only the deploy job of the same run needs it. The deployment itself stays recorded
          # on the Environments page and in the app's deployment history.
          retention-days: 7

  deploy:
    name: Deploy to staging
    needs: build
    # A convenience: a manual run from another branch stops after the build job. The boundary
    # is the environment's branch policy, which a change to this file cannot alter.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Records the deployment, with its commit, on the Environments page, applies the
    # environment's branch policy, supplies its variables, and puts `environment:staging` into
    # the OIDC token's subject, which is what the federated credential trusts.
    environment: staging
    # The one job that may request an OIDC token.
    permissions:
      id-token: write
      contents: read

    steps:
      # Without these, azure/login fails with messages that do not name the cause. The check
      # sees only whether each variable is set, so this step prints none of the values.
      - name: Check environment variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID != '' }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID != '' }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID != '' }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP != '' }}
          AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME != '' }}
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_FUNCTIONAPP_NAME; do
            [ "${!name}" = "true" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Environment not set up::The staging environment lacks the variables:$missing. See \"Continuous deployment\" in infra/README.md."
            exit 1
          fi

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: functionapp-${{ github.sha }}
          path: ${{ runner.temp }}/functionapp

      # Stops before anything reaches Azure if the package is not one the Functions host can
      # run. These are the checks Core Tools applies to a .NET isolated package (`func pack`):
      # worker.config.json describes a worker-indexed dotnet-isolated worker whose assembly
      # exists, extensions.json lists the host extensions, and .azurefunctions/ holds them.
      # Checked after the download, because the artifact round trip is where hidden files go
      # missing, and a package without .azurefunctions/ deploys cleanly, then cannot start.
      - name: Check package layout
        env:
          PACKAGE: ${{ runner.temp }}/functionapp
        run: |
          fail() {
            echo "::error title=Package layout::$1"
            exit 1
          }
          [ -f "$PACKAGE/host.json" ] || fail "host.json is missing."
          [ -f "$PACKAGE/.azurefunctions/function.deps.json" ] ||
            fail ".azurefunctions/ is missing or incomplete, so the host could not load the Event Hubs extension."
          jq -e '.extensions | type == "array"' "$PACKAGE/extensions.json" > /dev/null ||
            fail "extensions.json is missing or lists no extensions."
          worker=$(jq -er '.description
            | select(.language == "dotnet-isolated" and (.workerIndexing | tostring) == "true")
            | .defaultWorkerPath' "$PACKAGE/worker.config.json") ||
            fail "worker.config.json does not describe a worker-indexed dotnet-isolated worker."
          [ -f "$PACKAGE/$worker" ] || fail "The worker assembly $worker is missing."
          echo "Package layout OK: $(find "$PACKAGE" -type f | wc -l) files, worker $worker."

      # OIDC: no client secret. `id-token: write` above lets the action request the token.
      # Its post step signs the Azure CLI out again when the job ends.
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # With an Azure sign-in (RBAC) the action reads the app's SKU itself, sees
      # FlexConsumption and deploys through One Deploy, so `sku` is not set; Microsoft requires
      # it only with a publish profile. Basic authentication to the app's SCM site is off in
      # staging, so the action authenticates there with the identity's Entra ID token as well,
      # instead of fetching publishing credentials.
      - name: Deploy package
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ runner.temp }}/functionapp
          # The package is already built. A remote (Oryx) build of built .NET output fails,
          # because Oryx finds no project to build (Azure/functions-action#288). False is the
          # default; it is stated so that nobody turns it on expecting a faster deployment.
          remote-build: false

      # Step 5 of the procedure in infra/README.md, with the same calls. A code deployment
      # rotates no IoT Hub key, so nothing is stale after it: the refresh keeps the procedure
      # identical after every deployment of either kind, and reading the status back doubles
      # as a configuration health check, which fails the run if the app can no longer resolve
      # its trigger's connection. `{subscriptionId}` is literal: az rest substitutes the
      # signed-in subscription, so the ID appears in no URL.
      #
      # Initialized means not resolved yet, and is polled. Denied access, a missing secret and a
      # missing vault fail at once; any other status is polled until the time limit.
      - name: Refresh Key Vault references
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          FUNCTION_APP: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
        run: |
          refs="https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/sites/$FUNCTION_APP/config/configreferences/appsettings"
          az rest --method post --url "$refs/refresh?api-version=2022-03-01" --output none

          attempts=20
          for attempt in $(seq 1 "$attempts"); do
            reference=$(az rest --method get --url "$refs/IoTHubConnection?api-version=2022-03-01" --output json)
            status=$(jq -r '.properties.status // "unknown"' <<< "$reference")
            details=$(jq -r '.properties.details // ""' <<< "$reference")
            case "$status" in
              Resolved)
                echo "IoTHubConnection: Resolved."
                exit 0
                ;;
              AccessToKeyVaultDenied | SecretNotFound | VaultNotFound)
                echo "::error title=Key Vault reference::IoTHubConnection is $status. $details See step 5 of \"Deploy\" in infra/README.md."
                exit 1
                ;;
            esac
            echo "IoTHubConnection: $status (attempt $attempt of $attempts)."
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 15
            fi
          done
          echo "::error title=Key Vault reference::IoTHubConnection did not resolve within 5 minutes. Last status: $status. $details"
          exit 1

      # A smoke check, not proof that telemetry is processed; a live message is (step 7 of
      # "Deploy" in infra/README.md). The listing is the platform's record of the app's
      # functions, which a trigger sync fills in from the running host. Azure.Functions.Sdk uses
      # worker indexing, so the host knows ProcessTelemetry only once the new worker has started
      # and reported it; a worker that fails at startup leaves the host's placeholder, WarmUp,
      # listed instead (Azure/azure-functions-host#10169).
      #
      # Each attempt first requests a sync (the documented Sync Functions operation). The sync
      # the deployment itself performs can run before a new instance has started, and then
      # leaves WarmUp listed although the app is healthy (Azure/functions-action#373). A sync
      # can fail while the host is starting; the next attempt tries again. The listing can lag
      # the sync, so a failure is real, while a pass is a good sign rather than a guarantee.
      - name: Check the function is listed
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          FUNCTION_APP: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
        run: |
          sync="https://management.azure.com/subscriptions/{subscriptionId}/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Web/sites/$FUNCTION_APP/host/default/sync?api-version=2025-03-01"
          attempts=20
          for attempt in $(seq 1 "$attempts"); do
            az rest --method post --url "$sync" --output none ||
              echo "The trigger sync failed (attempt $attempt of $attempts)."
            functions=$(az functionapp function list --name "$FUNCTION_APP" --resource-group "$RESOURCE_GROUP" --query "[].name" --output tsv)
            if grep -qFx "$FUNCTION_APP/ProcessTelemetry" <<< "$functions"; then
              echo "ProcessTelemetry is listed."
              exit 0
            fi
            echo "ProcessTelemetry is not listed yet (attempt $attempt of $attempts)."
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 15
            fi
          done
          hint=""
          if grep -q "/WarmUp$" <<< "$functions"; then
            hint=" Only the WarmUp placeholder is listed, which usually means the worker failed at startup; func start, run locally, prints the exception."
          fi
          echo "::error title=Smoke check::ProcessTelemetry was not listed within 5 minutes.$hint"
          exit 1
