name: CodeQL

# Static analysis (SAST) with GitHub CodeQL, of the C# sources and of the GitHub Actions
# workflows.
#
# This is the "security testing" leg of the supply-chain work: Dependabot watches the
# code we consume, CodeQL watches the code we write. Findings land in the repository's
# Code scanning tab, which is also where an auditor would look for evidence that
# vulnerabilities are being looked for systematically rather than ad hoc
# (CRA Annex I Part II pt. 1-2).
#
# The workflows are code we write too, and they hold the most powerful credential in the
# repository: deploy.yml signs in to Azure with OIDC. A workflow that expands untrusted
# input, such as a pull request title, into a script, or that checks out and runs a pull
# request's code with elevated permissions, can be made to act with that credential.
# CodeQL's `actions` language looks for exactly that.
#
# Both analyses run the `security-extended` query suite instead of the default one: the
# default queries plus lower-severity and lower-precision ones. For the workflows that adds
# the medium-severity variants of the injection and untrusted-checkout queries and the
# check for actions referenced by a mutable tag. In a repository this size the extra
# alerts are few and cheap to triage, and a missed one is not.
# https://docs.github.com/en/code-security/code-scanning/managing-your-code-scanning-configuration/codeql-query-suites
#
# The checks this workflow publishes are advisory. Branch protection on main requires only
# `Format, build and test` from ci.yml; a CodeQL alert is for a human to read, not an
# automatic merge block.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays at 04:27 UTC. The scheduled run is not redundant with the push and
    # pull_request runs: CodeQL's query packs are updated continuously, so a weekly
    # re-analysis catches newly published queries firing against code that has not
    # changed since it was last scanned. Without it, a file would only ever be judged
    # by the queries that existed the day it was written. The odd minute avoids the
    # top-of-hour congestion on GitHub's shared schedulers.
    - cron: "27 4 * * 1"
  workflow_dispatch:

# Least privilege: read the sources, write the analysis results. Nothing else, and the same
# for both jobs. `actions: read` is only required for private repositories; this one is
# public.
permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

# Two jobs rather than a matrix: the C# analysis needs the .NET SDK, a restore and a build,
# the workflow analysis needs none of them, and a matrix would hang an `if:` on every step
# that differs.
#
# The C# job keeps the ID `analyze`. Code scanning records each analysis under a key made of
# the workflow file and the job ID (.github/workflows/codeql.yml:analyze), so renaming the
# job would start a new configuration and leave the old one behind, stale, on main.
jobs:
  analyze:
    name: CodeQL analyse (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Actions are pinned to full commit SHAs rather than mutable tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Identical to ci.yml on purpose: CodeQL must analyse the assemblies the real
          # build produces, which means the same pinned SDK.
          global-json-file: global.json

      - name: Show .NET SDK
        run: |
          dotnet --version
          dotnet --list-sdks

      # `build-mode: manual` instead of CodeQL's autobuild.
      #
      # Autobuild guesses how to build the repository. Driving restore and build explicitly
      # keeps this workflow aligned with ci.yml, so an alert here refers to the same
      # compilation that CI gates on rather than to whatever autobuild chose.
      #
      # The restore is the subtle part. src/IIoT.Functions uses the Azure.Functions.Sdk
      # project SDK, whose post-restore hook generates the Functions extensions project.
      # Restoring the project directly runs that hook; restoring the *solution* skips it
      # unless Directory.Solution.targets wires it back in. Without that, the build emits
      # AZFW0108 and falls back to an implicit restore during build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      # Solution-level restore, as in ci.yml. Directory.Solution.targets makes it run the
      # Functions post-restore hook, which a plain solution restore would skip (AZFW0108).
      - name: Restore
        run: dotnet restore IIoT.slnx

      # UseSharedCompilation=false keeps Roslyn out of its persistent compiler server, so
      # every csc invocation is visible to the CodeQL tracer and no project is silently
      # left out of the database.
      - name: Build
        run: dotnet build IIoT.slnx --no-restore --configuration Release -p:UseSharedCompilation=false

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:csharp"

  analyze-actions:
    name: CodeQL analyse (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions are pinned to full commit SHAs rather than mutable tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Workflow files are YAML, read as they are; there is nothing to compile, so the
      # `actions` language takes `build-mode: none` and needs no .NET setup. It analyses
      # every workflow under .github/workflows/ and any action.yml in the repository.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      # A category of its own, so the two analyses of the same commit stay separate in the
      # Code scanning tab and neither replaces the other's results.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:actions"
