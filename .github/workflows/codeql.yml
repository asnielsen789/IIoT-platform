name: CodeQL

# Static analysis (SAST) of the C# sources with GitHub CodeQL.
#
# This is the "security testing" leg of the supply-chain work: Dependabot watches the
# code we consume, CodeQL watches the code we write. Findings land in the repository's
# Code scanning tab, which is also where an auditor would look for evidence that
# vulnerabilities are being looked for systematically rather than ad hoc
# (CRA Annex I Part II pt. 1-2).
#
# The check this workflow publishes is advisory. Branch protection on main requires only
# `Format, build and test` from ci.yml; a CodeQL alert is for a human to read, not an
# automatic merge block.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays at 04:27 UTC. The scheduled run is not redundant with the push and
    # pull_request runs: CodeQL's query packs are updated continuously, so a weekly
    # re-analysis catches newly published queries firing against code that has not
    # changed since it was last scanned. Without it, a file would only ever be judged
    # by the queries that existed the day it was written. The odd minute avoids the
    # top-of-hour congestion on GitHub's shared schedulers.
    - cron: "27 4 * * 1"
  workflow_dispatch:

# Least privilege: read the sources, write the analysis results. Nothing else.
# `actions: read` is only required for private repositories; this one is public.
permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  analyze:
    name: CodeQL analyse (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Actions are pinned to full commit SHAs rather than mutable tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Identical to ci.yml on purpose: CodeQL must analyse the assemblies the real
          # build produces, which means the same pinned SDK.
          global-json-file: global.json

      - name: Show .NET SDK
        run: |
          dotnet --version
          dotnet --list-sdks

      # `build-mode: manual` instead of CodeQL's autobuild.
      #
      # Autobuild guesses how to build the repository. Driving restore and build explicitly
      # keeps this workflow aligned with ci.yml, so an alert here refers to the same
      # compilation that CI gates on rather than to whatever autobuild chose.
      #
      # The restore is the subtle part. src/IIoT.Functions uses the Azure.Functions.Sdk
      # project SDK, whose post-restore hook generates the Functions extensions project.
      # Restoring the project directly runs that hook; restoring the *solution* skips it
      # unless Directory.Solution.targets wires it back in. Without that, the build emits
      # AZFW0108 and falls back to an implicit restore during build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp
          build-mode: manual

      # Solution-level restore, as in ci.yml. Directory.Solution.targets makes it run the
      # Functions post-restore hook, which a plain solution restore would skip (AZFW0108).
      - name: Restore
        run: dotnet restore IIoT.slnx

      # UseSharedCompilation=false keeps Roslyn out of its persistent compiler server, so
      # every csc invocation is visible to the CodeQL tracer and no project is silently
      # left out of the database.
      - name: Build
        run: dotnet build IIoT.slnx --no-restore --configuration Release -p:UseSharedCompilation=false

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:csharp"
